<!-- Campo de una linea: sin caja. La etiqueta sube al escribir y el trazo se tensa. -->
<style>
  .cl-campo {
    position: relative;
    display: block;
    width: 260px;
    padding-top: 18px;
    font-family: "Archivo", system-ui, sans-serif;
  }

  .cl-campo input {
    width: 100%;
    padding: 6px 0 8px;
    font: 500 15px/1.2 inherit;
    color: #17150f;
    background: transparent;
    border: 0;
    border-bottom: 1.5px solid rgba(23, 21, 15, .35);
    outline: none;
  }

  .cl-texto {
    position: absolute; left: 0; top: 24px;
    font-size: 15px;
    color: rgba(23, 21, 15, .55);
    pointer-events: none;
    transform-origin: left top;
    transition: translate .18s ease, scale .18s ease, color .18s ease;
  }

  .cl-campo input:focus + .cl-texto,
  .cl-campo input:not(:placeholder-shown) + .cl-texto {
    translate: 0 -24px;
    scale: .78;
    color: #2436d9;
  }

  /* el trazo se dibuja de izquierda a derecha al enfocar */
  .cl-trazo {
    position: absolute; left: 0; right: 0; bottom: 0;
    height: 1.5px;
    background: #2436d9;
    scale: 0 1;
    transform-origin: left;
    transition: scale .22s cubic-bezier(.2, .7, .3, 1);
  }
  .cl-campo input:focus ~ .cl-trazo { scale: 1 1; }

  @media (prefers-reduced-motion: reduce) {
    .cl-texto, .cl-trazo { transition: none; }
  }
</style>

<label class="cl-campo">
  <input type="text" placeholder=" " autocomplete="off">
  <span class="cl-texto">Nombre de la pieza</span>
  <span class="cl-trazo" aria-hidden="true"></span>
</label>
