<!-- Barra de segmentos: un solo indicador se desliza entre las opciones.
     Sin JS: el estado vive en tres radios y el indicador se mueve con :has(). -->
<style>
  .bs-barra {
    position: relative;
    display: inline-grid;
    grid-auto-flow: column;
    grid-auto-columns: 1fr;
    padding: 3px;
    border: 1.5px solid #17150f;
    background: #efebe1;
    font-family: "Archivo", system-ui, sans-serif;
  }

  .bs-indicador {
    position: absolute;
    top: 3px; bottom: 3px; left: 3px;
    width: calc((100% - 6px) / 3);
    background: #17150f;
    transition: translate .2s cubic-bezier(.2, .7, .3, 1);
  }

  .bs-barra input { position: absolute; opacity: 0; pointer-events: none; }

  .bs-barra label {
    position: relative;
    padding: 9px 18px;
    font: 600 13px/1 inherit;
    color: #17150f;
    text-align: center;
    white-space: nowrap;
    cursor: pointer;
    transition: color .2s ease;
  }

  .bs-barra:has(#bs-2:checked) .bs-indicador { translate: 100% 0; }
  .bs-barra:has(#bs-3:checked) .bs-indicador { translate: 200% 0; }

  .bs-barra input:checked + label { color: #efebe1; }
  .bs-barra input:focus-visible + label { outline: 2px solid #2436d9; outline-offset: 2px; }

  @media (prefers-reduced-motion: reduce) {
    .bs-indicador { transition: none; }
  }
</style>

<div class="bs-barra">
  <span class="bs-indicador" aria-hidden="true"></span>
  <input type="radio" name="bs" id="bs-1" checked><label for="bs-1">Piezas</label>
  <input type="radio" name="bs" id="bs-2"><label for="bs-2">Formas</label>
  <input type="radio" name="bs" id="bs-3"><label for="bs-3">Logos</label>
</div>
