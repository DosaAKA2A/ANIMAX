<!-- Panel de vidrio real: desenfoca lo que tiene detras, no es un gris con opacidad.
     El fondo de colores esta aqui solo para que se note; en tu pagina lo quitas. -->
<style>
  .pv-escena {
    position: relative;
    width: 320px; height: 190px;
    overflow: hidden;
    font-family: "Archivo", system-ui, sans-serif;
  }

  /* lo que hay detras del vidrio */
  .pv-fondo {
    position: absolute; inset: 0;
    background:
      radial-gradient(60% 80% at 15% 20%, #2436d9 0%, transparent 60%),
      radial-gradient(50% 70% at 85% 75%, #d94a24 0%, transparent 60%),
      #17150f;
  }

  .pv-panel {
    position: absolute; left: 24px; right: 24px; top: 46px;
    padding: 16px 18px;
    color: #f4f2ec;
    background: rgba(244, 242, 236, .10);
    border: 1px solid rgba(244, 242, 236, .22);
    border-top-color: rgba(244, 242, 236, .38);
    backdrop-filter: blur(14px) saturate(1.4);
    -webkit-backdrop-filter: blur(14px) saturate(1.4);
    box-shadow: 0 12px 30px rgba(0, 0, 0, .35);
  }

  .pv-titulo { font: 700 14px/1.2 inherit; margin: 0 0 6px; }
  .pv-linea { font: 400 12px/1.45 inherit; margin: 0; color: rgba(244, 242, 236, .72); }
</style>

<div class="pv-escena">
  <div class="pv-fondo" aria-hidden="true"></div>
  <div class="pv-panel">
    <p class="pv-titulo">Vidrio real</p>
    <p class="pv-linea">El desenfoque toma el color de lo que hay detras. Sobre un fondo plano no se ve nada, y eso esta bien.</p>
  </div>
</div>
