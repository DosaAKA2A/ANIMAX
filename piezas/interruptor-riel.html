<!-- Interruptor de riel: el pulgar es cuadrado y el riel lleva la palabra del estado.
     Nada de pastilla redondeada. -->
<style>
  .ir-fila {
    display: inline-flex; align-items: center; gap: 12px;
    font-family: "Archivo", system-ui, sans-serif;
  }

  .ir-riel {
    position: relative;
    width: 76px; height: 30px;
    background: #efebe1;
    border: 1.5px solid #17150f;
    cursor: pointer;
    flex: none;
  }

  .ir-riel input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }

  .ir-pulgar {
    position: absolute; top: 2px; left: 2px;
    width: 34px; height: 22px;
    background: #17150f;
    transition: translate .18s cubic-bezier(.2, .7, .3, 1), background .18s ease;
    pointer-events: none;
  }

  .ir-estado {
    position: absolute; right: 9px; top: 50%; translate: 0 -50%;
    font: 500 10px/1 "JetBrains Mono", ui-monospace, monospace;
    color: rgba(23, 21, 15, .55);
    pointer-events: none;
    transition: color .18s ease;
  }

  .ir-riel:has(input:checked) .ir-pulgar { translate: 36px 0; background: #2436d9; }
  .ir-riel:has(input:checked) .ir-estado { right: auto; left: 9px; color: #2436d9; }
  .ir-estado[data-si] { display: none; }
  .ir-riel:has(input:checked) .ir-estado[data-si] { display: block; }
  .ir-riel:has(input:checked) .ir-estado[data-no] { display: none; }
  .ir-riel:has(input:focus-visible) { outline: 2px solid #2436d9; outline-offset: 3px; }

  .ir-texto { font: 600 14px/1 inherit; color: #17150f; }

  @media (prefers-reduced-motion: reduce) {
    .ir-pulgar { transition: none; }
  }
</style>

<label class="ir-fila">
  <span class="ir-riel">
    <input type="checkbox" checked>
    <span class="ir-pulgar" aria-hidden="true"></span>
    <span class="ir-estado" data-no aria-hidden="true">off</span>
    <span class="ir-estado" data-si aria-hidden="true">on</span>
  </span>
  <span class="ir-texto">Vista previa en vivo</span>
</label>
