<!-- Tarjeta con la esquina cortada. El corte no es adorno: marca donde va el dato
     que identifica la ficha, y crece al pasar el raton. -->
<style>
  .te-tarjeta {
    --corte: 26px;
    position: relative;
    width: 250px;
    padding: 18px;
    color: #efebe1;
    background: #17150f;
    clip-path: polygon(0 0, calc(100% - var(--corte)) 0, 100% var(--corte), 100% 100%, 0 100%);
    transition: --corte .2s ease;
    font-family: "Archivo", system-ui, sans-serif;
  }

  @property --corte {
    syntax: "<length>";
    inherits: false;
    initial-value: 26px;
  }

  .te-tarjeta:hover { --corte: 40px; }

  .te-clave {
    font: 500 11px/1 "JetBrains Mono", ui-monospace, monospace;
    color: #2436d9;
    background: #efebe1;
    padding: 3px 6px;
    display: inline-block;
    margin-bottom: 12px;
  }

  .te-titulo { font: 800 17px/1.15 inherit; margin: 0 0 8px; }
  .te-texto { font: 400 12.5px/1.5 inherit; margin: 0; color: rgba(239, 235, 225, .68); }

  @media (prefers-reduced-motion: reduce) {
    .te-tarjeta { transition: none; }
  }
</style>

<article class="te-tarjeta">
  <span class="te-clave">AX-004</span>
  <h3 class="te-titulo">Tarjeta con esquina</h3>
  <p class="te-texto">El corte deja sitio a la clave de la ficha. Sin radios y sin sombra: la forma hace el trabajo.</p>
</article>
