<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Animax</title>
<meta name="description" content="Biblioteca de interfaces, SVGs, logos y tunes de IRIS Studio.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="animax.css">
</head>
<body>

<header class="tinta">
  <a class="tinta__marca" href="#/">
    <span class="tinta__nombre">Animax</span>
    <span class="tinta__nota">Biblioteca de IRIS Studio</span>
  </a>

  <div class="buscador">
    <label class="oculto" for="q">Buscar</label>
    <input id="q" type="search" autocomplete="off" spellcheck="false" placeholder="Buscar en toda la biblioteca">
    <kbd class="buscador__tecla">/</kbd>
  </div>

  <output class="tinta__cuenta" id="cuenta" for="q"></output>
</header>

<nav class="secciones" id="secciones" aria-label="Secciones"></nav>
<nav class="grupos" id="grupos" aria-label="Grupos de la seccion"></nav>

<main>
  <div class="tabla" id="tabla" role="list"></div>
  <div class="vacio" id="vacio" hidden></div>
</main>

<footer class="pie">
  <span>Cada ficha es un archivo suelto. Lo que ves es exactamente lo que copias.</span>
  <span class="pie__ver" id="version"></span>
</footer>

<script src="animax.js" type="module"></script>
</body>
</html>
