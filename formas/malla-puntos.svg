<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="240" height="180">
  <!-- Malla de puntos que se abre hacia abajo. Tileable en horizontal. -->
  <defs>
    <pattern id="mp" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#17150f"/>
    </pattern>
    <linearGradient id="mp-f" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="mp-m">
      <rect width="240" height="180" fill="url(#mp-f)"/>
    </mask>
  </defs>
  <rect width="240" height="180" fill="url(#mp)" mask="url(#mp-m)"/>
</svg>
