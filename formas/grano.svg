<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <!-- Grano de pelicula. Ponlo encima con mix-blend-mode:multiply y opacidad baja.
       baseFrequency alto = grano fino; bajalo a .4 y sale nube. -->
  <filter id="gr" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
  </filter>
  <rect width="300" height="300" filter="url(#gr)" opacity=".5"/>
</svg>
